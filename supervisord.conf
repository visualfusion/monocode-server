[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd_err.log

[program:monocode-host]
command=node /opt/monocode/build/host/monocode-host.mjs serve
directory=/opt/monocode
user=coder
environment=HOME="/home/coder",USER="coder",PATH="/home/coder/.local/bin:/home/coder/.local/share/agy-acp:/usr/local/bin:/usr/bin:/bin",PORT="3774",HOST="127.0.0.1",ANTIGRAVITY_HARNESS_PATH="/usr/local/bin/localharness"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/monocode_host.log
stderr_logfile=/var/log/supervisor/monocode_host_err.log

# ==============================================================================
# OPTIONAL BROWSER GUI MODE (Variante B: KasmVNC / Headless Display)
# Aktivieren, wenn MonoCode später direkt im Browser gerendert werden soll:
